<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Shop</title>
<style>
* {
	margin:0;
	padding:0;
	box-sizing: border-box;
}
body{
	font-family: Arial, Helvetica, sans-serif;
	background-color: #f2f2f2;
}
.navbar{
	background-color: #2874f0;
	padding: 15px;
	display: flex;
	justify-content: space-between;
	align-items: center;
}
.navbar h1{
	color: white;
	font-size: 28px;
}
.navbar input{
	width: 300px;
	padding: 8px;
	border: none;
	border-radius: 3px;
}
.cart-btn{
	background-color: orange;
	color: white;
	padding: 10px 15px;
	border: none;
	cursor: pointer;
	font-size: 16px;
	font-weight: bold;
}
.cart-btn:hover{
	background-color: rgb(255, 145, 0);
}
.container{
	padding: 20px;
}
.loading{
	text-align: center;
	font-size: 20px;
	padding: 50px;
	color: gray;
}
.products{
	display: flex;
	flex-wrap: wrap;
	gap: 15px;
	justify-content: flex-start;
}
.product-card{
	background: white;
	width: 220px;
	padding: 15px;
	border: 1px solid #ddd;
	text-align: center;
	position: relative;
}
.product-card img{
	width: 100%;
	height: 150px;
	object-fit: contain;
}
.product-card h3{
	font-size: 16px;
	margin: 10px 0px 5px 0px;
	height: 40px;
}
.price{
	color: green;
	font-weight: bold;
	font-size: 18px;
}
.old-price{
	text-decoration: line-through;
	color: gray;
	font-size: 14px;
	margin-left: 5px;
}
.add-btn{
	background-color: #fb641b;
	color: white;
	border: none;
	padding: 8px 12px;
	margin-top: 10px;
	cursor: pointer;
	width: 100%;
}
.add-btn:hover{
	opacity: 0.9;
}
/* cart sidebar - i know this could be a modal but doing it simple */
.cart-sidebar{
	position: fixed;
	right: -350px;
	top: 0;
	width: 320px;
	height: 100%;
	background: white;
	box-shadow: -2px 0px 10px rgba(0,0,0,0.3);
	transition: 0.3s;
	padding: 15px;
	overflow-y: auto;
}
.cart-sidebar.open{
	right: 0px;
}
.cart-item{
	display: flex;
	justify-content: space-between;
	border-bottom: 1px solid #eee;
	padding: 8px 0px;
	font-size: 14px;
}
.close-cart{
	float:right;
	cursor:pointer;
	font-size:20px;
	background:none;
	border:none;
}
.total-box{
	margin-top: 20px;
	font-weight: bold;
	font-size: 18px;
}
#checkoutBtn{
	width: 100%;
	background: green;
	color: white;
	padding: 10px;
	border: none;
	margin-top: 15px;
	cursor: pointer;
}
footer{
	text-align: center;
	padding: 20px;
	color: gray;
	margin-top: 30px;
	font-size: 13px;
}
.badge{
	position:absolute;
	top:5px;
	left:5px;
	background:red;
	color:white;
	font-size:11px;
	padding:2px 6px;
	border-radius: 3px;
}
</style>
</head>
<body>

<div class="navbar">
	<h1>MyShop</h1>
	<input type="text" id="searchBox" placeholder="Search for products...">
	<button class="cart-btn" onclick="openCart()">Cart (<span id="cartCount">0</span>)</button>
</div>

<div class="container">
	<div id="loadingMsg" class="loading">Loading products, please wait...</div>
	<div class="products" id="productList"></div>
</div>

<div class="cart-sidebar" id="cartSidebar">
	<button class="close-cart" onclick="closeCart()">X</button>
	<h2>Your Cart</h2>
	<div id="cartItems"></div>
	<div class="total-box">Total: ₹<span id="cartTotal">0</span></div>
	<button id="checkoutBtn" onclick="checkout()">Checkout</button>
</div>

<footer>
	&copy; 2026 MyShop. All rights reserved. Made with love (and bugs) by a fresher :)
</footer>

<script>
// ---- product data ----
// normally this comes from a backend api but im just faking it with a promise
var allProducts = [
	{id:1, name:"Wireless Bluetooth Headphones", price:1299, oldprice:2499, img:"https://via.placeholder.com/150?text=Headphones"},
	{id:2, name:"Smart Watch Series 5 - Fitness Tracker", price:2199, oldprice:3999, img:"https://via.placeholder.com/150?text=Smart+Watch"},
	{id:3, name:"Running Shoes for Men", price:999, oldprice:1999, img:"https://via.placeholder.com/150?text=Shoes"},
	{id:4, name:"Cotton T-Shirt (Pack of 2)", price:449, oldprice:899, img:"https://via.placeholder.com/150?text=T-Shirt"},
	{id:5, name:"Laptop Backpack Waterproof", price:799, oldprice:1499, img:"https://via.placeholder.com/150?text=Backpack"},
	{id:6, name:"Wired Earphones with Mic", price:199, oldprice:499, img:"https://via.placeholder.com/150?text=Earphones"},
	{id:7, name:"Coffee Mug Ceramic 350ml", price:149, oldprice:299, img:"https://via.placeholder.com/150?text=Mug"},
	{id:8, name:"Portable Power Bank 10000mAh", price:899, oldprice:1799, img:"https://via.placeholder.com/150?text=Power+Bank"}
];

var cart = [];

// function to "fetch" products using a Promise, adding fake delay like an api call
function fetchProducts(){
	return new Promise(function(resolve, reject){
		setTimeout(function(){
			// pretend theres a 90% chance it succeeds lol
			var success = true;
			if(success){
				resolve(allProducts);
			}else{
				reject("Something went wrong while fetching products");
			}
		}, 1500);
	});
}

// render products to the page
function renderProducts(list){
	var productListDiv = document.getElementById("productList");
	productListDiv.innerHTML = ""; //clearing old stuff

	for(var i = 0; i < list.length; i++){
		var p = list[i];
		var discount = Math.round(((p.oldprice - p.price)/p.oldprice)*100);

		var card = document.createElement("div");
		card.className = "product-card";
		card.innerHTML = `
			<span class="badge">${discount}% OFF</span>
			<img src="${p.img}" alt="product image">
			<h3>${p.name}</h3>
			<div>
				<span class="price">₹${p.price}</span>
				<span class="old-price">₹${p.oldprice}</span>
			</div>
			<button class="add-btn" onclick="addToCart(${p.id})">ADD TO CART</button>
		`;
		productListDiv.appendChild(card);
	}
}

// load the products when page starts
fetchProducts()
	.then(function(products){
		document.getElementById("loadingMsg").style.display = "none";
		renderProducts(products);
	})
	.catch(function(err){
		document.getElementById("loadingMsg").innerHTML = "Failed to load products :( " + err;
	});


function addToCart(id){
	// find the product - didnt use .find() bcoz not sure if it works on all browsers lol
	var product;
	for(var i=0; i<allProducts.length; i++){
		if(allProducts[i].id == id){
			product = allProducts[i];
		}
	}

	// check if already in cart
	var found = false;
	for(var j=0; j<cart.length; j++){
		if(cart[j].id == id){
			cart[j].qty = cart[j].qty + 1;
			found = true;
		}
	}
	if(!found){
		product.qty = 1;
		cart.push(product);
	}

	updateCartUI();
	alert(product.name + " added to cart!"); // TODO: replace this with a nicer toast later
}

function updateCartUI(){
	var cartCount = 0;
	var total = 0;
	var cartItemsDiv = document.getElementById("cartItems");
	cartItemsDiv.innerHTML = "";

	for(var i=0; i<cart.length; i++){
		var item = cart[i];
		cartCount += item.qty;
		total += item.qty * item.price;

		var div = document.createElement("div");
		div.className = "cart-item";
		div.innerHTML = "<span>" + item.name + " x" + item.qty + "</span><span>₹" + (item.qty*item.price) + "</span>";
		cartItemsDiv.appendChild(div);
	}

	document.getElementById("cartCount").innerText = cartCount;
	document.getElementById("cartTotal").innerText = total;
}

function openCart(){
	document.getElementById("cartSidebar").classList.add("open");
}
function closeCart(){
	document.getElementById("cartSidebar").classList.remove("open");
}

// fake checkout process using promise + settimeout, like its calling a payment api
function processPayment(amount){
	return new Promise(function(resolve, reject){
		if(amount <= 0){
			reject("Cart is empty, add something first");
			return;
		}
		console.log("processing payment of " + amount); // debug log, forgot to remove
		setTimeout(function(){
			resolve("Payment successful! Order placed.");
		}, 2000);
	});
}

function checkout(){
	var total = 0;
	for(var i=0;i<cart.length;i++){
		total += cart[i].qty * cart[i].price;
	}

	document.getElementById("checkoutBtn").innerText = "Processing...";

	processPayment(total)
		.then(function(msg){
			alert(msg);
			cart = []; // empty the cart
			updateCartUI();
			closeCart();
			document.getElementById("checkoutBtn").innerText = "Checkout";
		})
		.catch(function(err){
			alert("Error: " + err);
			document.getElementById("checkoutBtn").innerText = "Checkout";
		});
}

// search filter - only checking name, not the best way but works
document.getElementById("searchBox").addEventListener("keyup", function(){
	var query = this.value.toLowerCase();
	var filtered = allProducts.filter(function(p){
		return p.name.toLowerCase().includes(query);
	});
	renderProducts(filtered);
});

</script>

</body>
</html>
